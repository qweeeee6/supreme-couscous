{% extends "base.html" %}
{% block title %}发布商品 - 零食购物网{% endblock %}

{% block content %}
    <h2>{% if form.instance.id %}编辑商品{% else %}发布新商品{% endif %}</h2>
    <form method="post" enctype="multipart/form-data" class="mt-4">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">保存</button>
    </form>
{% endblock %}
